name: Deploy

# Deploys the Worker itself (src/**) on merge to main -- separate from
# .github/workflows/opentofu.yml (account-level infra) and
# .github/workflows/ci.yml (the required PR check: typecheck/lint/test).
#
# Re-runs typecheck + unit tests here too, even though ci.yml already
# required them to pass before merge: branch protection allows an admin
# bypass (this is a solo-maintained repo), so a merge can land without
# ci.yml actually having passed. This is the safety net for that case --
# cheap insurance against deploying something broken.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vitest.config.ts"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}

      # YNAB_CLIENT_ID/YNAB_CLIENT_SECRET are actual secrets (unlike
      # YNAB_REDIRECT_URI, which is just a public URL and lives as a plain
      # var in wrangler.jsonc instead) -- kept out of wrangler.jsonc and
      # out of Terraform state (see infra/README.md) by setting them here
      # from GitHub's own encrypted repo secrets, which are masked in logs
      # and never appear in a PR diff/comment the way Terraform-managed
      # secrets or vars committed to the repo would. Re-running this on
      # every deploy is deliberate, not just a one-time setup step: it's
      # what makes a Worker rename (`wrangler.jsonc`'s `name` field) safe
      # -- the brand-new Worker that creates gets these secrets
      # automatically instead of silently deploying without them, which is
      # exactly what happened the first time this Worker was renamed.
      - run: |
          echo "$YNAB_CLIENT_ID" | npx wrangler secret put YNAB_CLIENT_ID
          echo "$YNAB_CLIENT_SECRET" | npx wrangler secret put YNAB_CLIENT_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          YNAB_CLIENT_ID: ${{ secrets.YNAB_CLIENT_ID }}
          YNAB_CLIENT_SECRET: ${{ secrets.YNAB_CLIENT_SECRET }}
